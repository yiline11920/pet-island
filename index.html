<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東森寵物 萬丹店｜阿King 與白白的毛孩樂園小島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --glass-bg: rgba(255,250,243,.62);
  --glass-strong: rgba(255,255,255,.74);
  --glass-border: rgba(255,255,255,.82);
  --ink:#4b3226; --ink-soft:#80665a;
  --chip:#ffe3d1; --chip-ink:#8a4a2c;
  --good:#2f9e6c; --bad:#d9466f;
  --shadow: 0 24px 60px rgba(140,80,50,.22);
  --scrim: rgba(255,224,204,.18);
  --hint-bg: rgba(255,255,255,.58); --hint-ink:#3d5a74;
  --page:#bfe3ff; --focus:#ff7a45;
  --seg-on:#ffffff;
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --glass-bg: rgba(46,34,48,.64); --glass-strong: rgba(70,54,72,.72); --glass-border: rgba(255,255,255,.16);
    --ink:#fbeee4; --ink-soft:#d8c1b4; --chip: rgba(255,138,92,.24); --chip-ink:#ffd9c4;
    --good:#6fe0a8; --bad:#ff8fae; --shadow: 0 24px 60px rgba(0,0,0,.45); --scrim: rgba(18,10,28,.3);
    --hint-bg: rgba(40,30,46,.62); --hint-ink:#e6dcff; --page:#2a3550; --seg-on: rgba(255,255,255,.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --glass-bg: rgba(46,34,48,.64); --glass-strong: rgba(70,54,72,.72); --glass-border: rgba(255,255,255,.16);
  --ink:#fbeee4; --ink-soft:#d8c1b4; --chip: rgba(255,138,92,.24); --chip-ink:#ffd9c4;
  --good:#6fe0a8; --bad:#ff8fae; --shadow: 0 24px 60px rgba(0,0,0,.45); --scrim: rgba(18,10,28,.3);
  --hint-bg: rgba(40,30,46,.62); --hint-ink:#e6dcff; --page:#2a3550; --seg-on: rgba(255,255,255,.16);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{height:100%; scroll-padding-top: env(safe-area-inset-top, 0px);}
body{margin:0; height:100%; overflow:hidden; background:var(--page); color:var(--ink);
  font-family:"Fredoka","Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
#stage{position:fixed; inset:0}
#stage canvas{display:block; touch-action:none; outline:none}
button{font:inherit; color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.glass{background:var(--glass-bg); -webkit-backdrop-filter:blur(18px) saturate(170%); backdrop-filter:blur(18px) saturate(170%);
  border:1px solid var(--glass-border); box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.55)}

/* 頂部 */
.topbar{position:fixed; top:0; left:0; right:0; z-index:6; pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0; display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.brand{pointer-events:auto; border-radius:26px 26px 26px 10px; padding:10px; display:flex; flex-direction:column; gap:8px; max-width:min(400px, 72vw)}
.store{appearance:none; border:none; background:transparent; padding:0 8px 0 0; display:flex; gap:12px; align-items:center; text-align:left; cursor:pointer; border-radius:18px}
.shopicon{flex:none; width:54px; height:54px; border-radius:18px; display:grid; place-items:center; font-size:30px;
  background:radial-gradient(circle at 30% 25%, #fff3d6, #ffb27a 72%); box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.store h1{margin:0; font-size:19px; line-height:1.25; font-weight:700}
.store .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.open-dot{display:inline-flex; align-items:center; gap:5px; font-weight:600}
.open-dot::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--c, #aaa)}
.pets{display:flex; gap:6px}
.petbtn{appearance:none; flex:1; border:1px solid var(--glass-border); background:var(--glass-strong); border-radius:16px; padding:6px 10px 6px 6px;
  display:flex; gap:8px; align-items:center; cursor:pointer; text-align:left; min-width:0}
.petbtn .av{flex:none; width:34px; height:34px; border-radius:12px; display:grid; place-items:center; font-size:18px; overflow:hidden}
.av img, .dot img, .badge img, .mini img{width:100%; height:100%; object-fit:cover; border-radius:inherit; display:block}
.mini{width:22px; height:22px; border-radius:50%; overflow:hidden; display:inline-grid; place-items:center; flex:none}
.hero{margin:14px 0 0; border-radius:24px; overflow:hidden; border:1px solid var(--glass-border); background:var(--glass-strong)}
.hero img{display:block; width:100%; height:auto}
.hero figcaption{font-size:12.5px; color:var(--ink-soft); padding:8px 12px}
.badge{overflow:hidden}
.ilabel .dot{overflow:hidden}
.petbtn b{display:block; font-size:14px; line-height:1.2}
.petbtn small{display:block; font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.actions{display:flex; gap:8px; pointer-events:auto}
.btn{appearance:none; border:1px solid var(--glass-border); padding:10px 14px; border-radius:16px; cursor:pointer; font-weight:600; font-size:14px; display:flex; gap:6px; align-items:center; white-space:nowrap}
.btn[aria-pressed="false"]{opacity:.72}

/* 底部 */
.bottombar{position:fixed; left:0; right:0; bottom:0; z-index:6; pointer-events:none;
  padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px); display:flex; flex-direction:column; align-items:center; gap:10px}
.nav{pointer-events:auto; display:flex; gap:4px; padding:6px; border-radius:22px; max-width:100%; overflow-x:auto; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{appearance:none; border:none; background:transparent; padding:9px 13px; border-radius:16px; cursor:pointer; font-size:14px; font-weight:600; white-space:nowrap; display:flex; gap:6px; align-items:center}
.nav button:hover{background:var(--glass-strong)}
.nav .sep{width:1px; background:var(--glass-border); margin:6px 2px; flex:none}
.hint{font-size:12.5px; color:var(--hint-ink); background:var(--hint-bg); padding:6px 14px; border-radius:999px; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}

/* 標籤 */
.labels{position:fixed; inset:0; pointer-events:none; z-index:4; overflow:hidden}
.ilabel{position:absolute; left:0; top:0; pointer-events:auto; cursor:pointer; padding:7px 14px 7px 9px; border-radius:999px; font-weight:700; font-size:14px;
  white-space:nowrap; display:flex; gap:6px; align-items:center; opacity:0; transition:opacity .5s ease, scale .2s ease; transform-origin:50% 100%}
.ilabel .dot{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:13px}
.ilabel.show{opacity:1}
.ilabel.hot{scale:1.1}
.ilabel::after{content:""; position:absolute; left:50%; bottom:-6px; width:10px; height:10px; translate:-50% 0; rotate:45deg;
  background:var(--glass-bg); border-right:1px solid var(--glass-border); border-bottom:1px solid var(--glass-border)}
.ilabel.small{font-size:12px; padding:4px 10px 4px 6px}
.ilabel.small .dot{width:18px; height:18px; font-size:11px}

/* 視窗 */
.modal{position:fixed; inset:0; z-index:20; pointer-events:none}
.scrim{position:absolute; inset:0; background:var(--scrim); opacity:0; transition:opacity .35s}
.panel{position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:min(470px, 44vw); border-radius:32px; display:flex; flex-direction:column; overflow:hidden;
  transform:translateX(30px) scale(.97); opacity:0; transition:transform .5s cubic-bezier(.2,.9,.25,1.12), opacity .3s;
  -webkit-backdrop-filter:blur(26px) saturate(180%); backdrop-filter:blur(26px) saturate(180%)}
.modal.open{pointer-events:auto}
.modal.open .scrim{opacity:1}
.modal.open .panel{transform:none; opacity:1}
.panel-head{position:relative; padding:22px 60px 16px 22px; display:flex; gap:14px; align-items:center}
.panel-head::before{content:""; position:absolute; inset:0; background:var(--theme); opacity:.22; pointer-events:none}
.badge{position:relative; flex:none; width:62px; height:62px; border-radius:22px; display:grid; place-items:center; font-size:34px; background:var(--theme);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.1), 0 8px 18px rgba(0,0,0,.12)}
.panel-head h2{position:relative; margin:0; font-size:24px; line-height:1.2}
.panel-head p{position:relative; margin:4px 0 0; color:var(--ink-soft); font-size:14px; line-height:1.5}
.close{position:absolute; top:16px; right:16px; width:38px; height:38px; border-radius:50%; border:1px solid var(--glass-border); background:var(--glass-strong); cursor:pointer; font-size:16px; display:grid; place-items:center; z-index:2}
.panel-body{flex:1; overflow-y:auto; padding:6px 22px 24px; overscroll-behavior:contain}
.seg{display:flex; gap:4px; padding:4px; border-radius:16px; background:var(--chip); margin-top:12px}
.seg button{appearance:none; flex:1; border:none; background:transparent; padding:8px 10px; border-radius:12px; cursor:pointer; font-weight:700; font-size:14px; display:flex; gap:6px; justify-content:center; align-items:center; color:var(--chip-ink)}
.seg button[aria-pressed="true"]{background:var(--seg-on); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.08)}
.story{font-size:15px; line-height:1.75; margin:14px 0 4px; max-width:60ch}
.sec{margin-top:20px}
.sec h3{margin:0 0 10px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px}
.sec h3::before{content:""; width:8px; height:8px; border-radius:3px; background:var(--theme); rotate:45deg}
.card{background:var(--glass-strong); border:1px solid var(--glass-border); border-radius:20px; padding:12px 14px}
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.row{display:flex; gap:12px; align-items:center}
.row .num{flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; background:var(--chip); color:var(--chip-ink)}
.row .em{flex:none; font-size:28px}
.grow{flex:1; min-width:0}
.t{font-weight:700; font-size:15px}
.d{font-size:13px; color:var(--ink-soft); line-height:1.55; margin-top:2px}
.body-ink{color:var(--ink); margin:0}
.hearts{flex:none; color:#ff6b8b; font-size:13px; letter-spacing:1px}
.hearts .dim, .paws .dim{opacity:.22}
.paws{font-size:12px; letter-spacing:1px}
.paws .dim{filter:grayscale(1)}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; margin-bottom:8px}
.stats b{display:block; font-size:24px; font-weight:700}
.stats span{font-size:12px; color:var(--ink-soft)}
.good{color:var(--good)} .bad{color:var(--bad)}
.chart{width:100%; height:auto; display:block}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.photo{margin:0; border-radius:20px; overflow:hidden; background:var(--glass-strong); border:1px solid var(--glass-border)}
.ph{aspect-ratio:4/3; display:grid; place-items:center; font-size:46px; position:relative}
.ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.photo figcaption{padding:9px 11px 11px; font-size:12.5px; line-height:1.5; color:var(--ink-soft)}
.photo figcaption b{display:block; color:var(--ink); font-size:14px; margin-bottom:2px}
.links{display:flex; flex-direction:column; gap:8px}
.link{display:flex; justify-content:space-between; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:600; font-size:14px}
.link span{font-size:12px; color:var(--ink-soft); font-weight:500; white-space:nowrap}
.link.empty{opacity:.75}
.edit{font-size:12.5px; color:var(--ink-soft); margin-top:18px; line-height:1.6}
.pose{display:flex; flex-direction:column; gap:4px}
.pose .em{font-size:32px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:14px; line-height:1.5; margin:0}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0; font-weight:600}
.steps{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px; counter-reset:s}
.steps li{counter-increment:s; display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:6px 10px 6px 6px; border-radius:999px; background:var(--glass-strong); border:1px solid var(--glass-border)}
.steps li::before{content:counter(s); width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11.5px; background:var(--theme); color:#fff}
.timeline{list-style:none; margin:0; padding:0 0 0 18px; position:relative}
.timeline::before{content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; border-radius:2px; background:var(--chip)}
.timeline li{position:relative; margin-bottom:10px}
.timeline li::before{content:""; position:absolute; left:-17px; top:16px; width:12px; height:12px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px var(--glass-strong)}
.tag{display:inline-block; font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:999px; color:#fff; background:var(--c)}
.date{font-size:12.5px; color:var(--ink-soft); margin-left:6px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-size:12px; padding:3px 10px; border-radius:999px; background:var(--chip); color:var(--chip-ink); font-weight:600; white-space:nowrap}
.cta{display:flex; flex-wrap:wrap; gap:8px}
.cta a, .jump button{appearance:none; text-decoration:none; border:1px solid var(--glass-border); background:var(--glass-strong); padding:9px 13px; border-radius:14px; cursor:pointer; font-weight:600; font-size:13.5px; display:inline-flex; gap:6px; align-items:center}
.jump{display:flex; flex-wrap:wrap; gap:8px}
.status{display:inline-flex; gap:6px; align-items:center; font-weight:700; font-size:13px; padding:3px 10px; border-radius:999px; background:var(--glass-strong)}
.status::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--c)}

#loader{position:fixed; inset:0; z-index:30; display:grid; place-items:center; background:linear-gradient(#8fd0ff,#ffe4cf); transition:opacity .8s; color:#5a3a2a}
#loader.gone{opacity:0; pointer-events:none}
#loader div{font-size:18px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:10px}
#loader span{font-size:44px; animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}

@media (max-width:720px){
  .brand{padding:8px; max-width:calc(100vw - 120px)}
  .shopicon{width:42px; height:42px; font-size:24px; border-radius:14px}
  .store h1{font-size:16px}
  .store .addr{display:none}
  .petbtn small{display:none}
  .btn .txt{display:none}
  .ilabel{font-size:12px; padding:5px 10px 5px 6px}
  .ilabel .dot{width:18px; height:18px; font-size:11px}
  .panel{left:10px; right:10px; width:auto; top:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); max-height:72%; transform:translateY(40px); border-radius:28px}
  .grid2{gap:8px}
}
@media (prefers-reduced-motion: reduce){
  .panel, .scrim, .ilabel{transition:none}
  #loader span{animation:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="labels" id="labels"></div>

<header class="topbar">
  <div class="brand glass">
    <button class="store" id="storeBtn" aria-label="查看萬丹店門市資訊">
      <div class="shopicon">🏪</div>
      <div>
        <h1>東森寵物 萬丹店</h1>
        <div class="sub"><span class="open-dot" id="openNow"></span><span class="addr">屏東縣萬丹鄉萬丹路一段186號</span></div>
      </div>
    </button>
    <div class="pets" id="petBtns"></div>
  </div>
  <div class="actions">
    <button class="btn glass" id="spinBtn" aria-pressed="true" title="自動旋轉">🌀<span class="txt">自動旋轉</span></button>
    <button class="btn glass" id="rainBtn" aria-pressed="false" title="下雨模式">🌧️<span class="txt">下雨</span></button>
    <button class="btn glass" id="homeBtn" title="回到全景">🏝️<span class="txt">全景</span></button>
  </div>
</header>

<div class="bottombar">
  <nav class="nav glass" id="nav" aria-label="小島導覽"></nav>
  <div class="hint" id="hint">拖曳旋轉、滾輪縮放，點小島或島主看故事</div>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="panel glass" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" data-close aria-label="關閉">✕</button>
    <div class="panel-head">
      <div class="badge" id="mIcon"></div>
      <div><h2 id="mTitle"></h2><p id="mSub"></p></div>
    </div>
    <div class="panel-body" id="mBody"></div>
  </div>
</div>

<div id="loader"><div><span>🐾</span>萬丹小島正在浮出水面…</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';

/* =========================================================

  if (o.side) p.side = o.side;
  if (o.map) p.map = o.map;
  return new THREE.MeshStandardMaterial(p);
}
function add(parent, geo, material, x=0, y=0, z=0){

}

function buildIsland(key){
  const d = ISL[key];
  const g = new THREE.Group(); g.position.set(d.c[0], 0, d.c[1]); g.userData.key = key; d.occ = [];
  d.topMat = mat(d.top, {flat:true});
  add(g, new THREE.CylinderGeometry(6,6,.55,6), d.topMat, 0, TOP-.275, 0);
  add(g, new THREE.CylinderGeometry(5.84,5.84,.12,6), mat(0xfff4dc,{flat:true}), 0, .38, 0);
  add(g, new THREE.CylinderGeometry(5.8,5.55,1.25,6), mat(0xf2bf8c,{flat:true}), 0, -.25, 0);
  add(g, new THREE.CylinderGeometry(5.55,1.3,3.4,6), mat(0xd99e78,{flat:true}), 0, -2.57, 0);
  for (let i = 0; i < 6; i++){ const [x,z] = at(30 + i*60, 5.55); const r = add(g, G.rock, rockMat, x, TOP+.05, z); r.scale.setScalar(rr(.7,1.2)); r.rotation.y = rr(0,6); }
  BUILD[key](g, d);
  scatter(g, d, key);
  const foam = new THREE.Mesh(new THREE.RingGeometry(5.7, 7.1, 6, 1, Math.PI/6), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0, depthWrite:false }));
  foam.rotation.x = -Math.PI/2; foam.position.set(d.c[0], WATER_Y + .32, d.c[1]); foam.renderOrder = 1; scene.add(foam); d.foam = foam;
  g.position.y = -10; scene.add(g); pickables.push(g); islandGroups[key] = g;
}

function scatter(g, d, key){
  const corridors = ADJ[key].map(n => { const o = ISL[n].c; const dx = o[0]-d.c[0], dz = o[1]-d.c[1], l = Math.hypot(dx,dz); return [dx/l, dz/l]; });
  VISITS[key].forEach(v => corridors.push(at(v.a, 1)));
  const free = (x, z, pad) => {
    for (const o of d.occ) if (Math.hypot(x-o.x, z-o.z) < o.rad + pad) return false;
    for (const [ux,uz] of corridors){ const t = x*ux + z*uz; if (t > 0 && Math.abs(x*uz - z*ux) < 1.0) return false; }
    return true;
  };
  const tuftMat = mat(new THREE.Color(d.top).multiplyScalar(.82).getHex(), {flat:true});
  let placed = 0, tries = 0;
  while (placed < 16 && tries++ < 400){
    const [x,z] = at(rr(0,360), rr(1.2,5.1));
    if (!free(x, z, .25)) continue;
    const type = rnd();
    if (type < .55){ add(g, G.stem, stemMat, x, TOP+.15, z); add(g, G.bloom, flowerMats[Math.floor(rnd()*flowerMats.length)], x, TOP+.33, z); }
    else if (type < .85){ for (let k = 0; k < 3; k++){ const t = add(g, G.tuft, tuftMat, x+rr(-.12,.12), TOP+.15, z+rr(-.12,.12)); t.rotation.z = rr(-.3,.3); } }
    else { const s = add(g, G.rock, rockMat, x, TOP+.08, z); s.scale.setScalar(rr(.5,.9)); }
    d.occ.push({x, z, rad:.25}); placed++;
  }
}

/* ================= 下雨 ================= */
const RAIN_N = 900, rainPos = new Float32Array(RAIN_N*6);
for (let i = 0; i < RAIN_N; i++){ const x = rr(-34,34), y = rr(WATER_Y, 30), z = rr(-34,34); rainPos.set([x, y, z, x - .04, y - .75, z], i*6); }
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color:0xeaf6ff, transparent:true, opacity:.6 }));
rain.visible = false; rain.frustumCulled = false; scene.add(rain);
function updateRain(dt){
  if (!rain.visible) return;
  for (let i = 0; i < RAIN_N; i++){ const o = i*6; let y = rainPos[o+1] - 24*dt; if (y < WATER_Y) y += 31; rainPos[o+1] = y; rainPos[o+4] = y - .75; }
  rainGeo.attributes.position.needsUpdate = true;
}

  const tx = canvasTex(128, 128, (c, w, h) => { c.fillStyle = base; c.fillRect(0,0,w,h); c.fillStyle = dot; for (let i = 0; i < 26; i++){ c.beginPath(); c.ellipse((i*53)%128, (i*37 + (i%3)*11)%128, 6, 3, i, 0, Math.PI*2); c.fill(); } });
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(3, 2);
  return coatTexCache[k] = tx;
}
function buildCat(o){

  if (strM) [-.28,-.1,.08].forEach(z => { const s = new THREE.Mesh(new THREE.TorusGeometry(Math.sqrt(.25-z*z)+.006,.045,8,24,Math.PI*.55), strM); s.position.z = z; s.rotation.z = Math.PI/2 - Math.PI*.275; body.add(s); });
  add(rig, new THREE.SphereGeometry(.26,20,14), creamM, 0, .6 - lo, .5).scale.set(1,1.1,.6);
  if (P){ const ruff = add(rig, new THREE.TorusGeometry(.3,.16,12,24), creamM, 0, .84 - lo, .38); ruff.rotation.x = Math.PI/2 - .55; }
  const head = new THREE.Group(); head.position.set(0, .96 - lo, .4); head.scale.setScalar(o.q || 1.3); rig.add(head);
  const hz = .12;
  const skull = add(head, new THREE.SphereGeometry(.42,28,20), furM, 0, .14, hz); skull.scale.set(1.1*hs, .95*hs, 1*hs);
  if (strM){
    [-.04,-.16,-.27].forEach(z => { const s = new THREE.Mesh(new THREE.TorusGeometry(Math.sqrt(.42*.42-z*z)+.005,.035,8,20,Math.PI*.3), strM); s.position.z = z; s.rotation.z = Math.PI/2 - Math.PI*.15; skull.add(s); });
    [-1,1].forEach(s => { const c = new THREE.Mesh(new THREE.TorusGeometry(.4,.025,6,16,Math.PI*.18), strM); c.position.set(0, -.02, .05); c.rotation.set(0, s*.9, s > 0 ? -.1 : Math.PI + .1); skull.add(c); });
  }
  if (P || o.short) [-1,1].forEach(s => add(head, new THREE.SphereGeometry(.17,14,10), creamM, s*.31*hs, -.01, hz + .22*hs));
  const mz = hz + (P ? .4 : .37)*hs, my = P ? .07 : .03, mr = P ? .11 : .13;
  [-.085,.085].forEach(x => add(head, new THREE.SphereGeometry(mr,16,12), creamM, x*hs, my, mz).scale.set(1,.85,.8));
  add(head, new THREE.SphereGeometry(.045,10,8), pinkM, 0, my + .08, mz + .09).scale.set(1.3,.9,.8);
  const eyes = [-.17,.17].map(x => {
    const e = add(head, new THREE.SphereGeometry(.088,16,12), mat(o.eye, {roughness:.2}), x*hs*1.04, .19, hz + .37*hs); e.scale.set(1,1.2,.6);
    if (o.pupil) add(e, new THREE.SphereGeometry(.055,12,10), darkM, 0, 0, .05).scale.set(.8,1,1);
    add(e, new THREE.SphereGeometry(.03,8,6), whiteM, .028, .035, .075);
    add(e, new THREE.SphereGeometry(.014,8,6), whiteM, -.025, -.03, .075);
    return e;
  });
  [-.28,.28].forEach(x => { const b = add(head, new THREE.SphereGeometry(.07,12,8), mat(0xff9fb2, {transparent:true, opacity:.75}), x*hs, .06, hz + .31*hs); b.scale.set(1,.6,.4); b.castShadow = false; });
  const es = P ? .72 : .9, spread = P ? 1.15 : 1.05, ears = [];

    const ex = s*.25*hs*spread, ey = .14 + .36*hs*(P ? .92 : 1);
    const e = add(head, new THREE.ConeGeometry(.16*es,.34*es,16), furM, ex, ey, .08); e.rotation.z = -s*(P ? .5 : .38);
    const ie = add(head, new THREE.ConeGeometry(.09*es,.2*es,12), pinkM, ex, ey - .03, .13); ie.rotation.z = -s*(P ? .5 : .38);
    ears.push(e, ie);
    [[.04,.12],[-.01,-.08]].forEach(([y, rz]) => { const w = add(head, new THREE.BoxGeometry(.32,.012,.012), mat(0xe8e2da), s*.33*hs, y + .04, hz + .33*hs); w.rotation.set(0, -s*.35, s*rz); w.castShadow = false; });
  });
  const L = .4 - lo;
  const legs = [[-.22,.3],[.22,.3],[-.22,-.3],[.22,-.3]].map(([x,z]) => {
    const p = new THREE.Group(); p.position.set(x*fl, .46 - lo, z); rig.add(p);
    add(p, new THREE.CylinderGeometry(.1*fl*(o.short ? 1.15 : 1),.11*fl*(o.short ? 1.15 : 1),L,14), furM, 0, -L/2, 0);
    add(p, new THREE.SphereGeometry(.13*fl*(o.short ? 1.1 : 1),16,12), creamM, 0, -L - .02, .04).scale.set(1,.7,1.25);

  const tail = new THREE.Group(); tail.position.set(0, .74 - lo, -.5*fl); rig.add(tail);

  add(tail, new THREE.SphereGeometry(tr*1.15,12,10), strM || creamM, .04, .76, -.04);
  if (strM) [.3,.5,.7].forEach(u => { const p = curve.getPointAt(u), tg = curve.getTangentAt(u); const r = add(tail, new THREE.TorusGeometry(tr+.004,.026,6,16), strM, p.x, p.y, p.z); r.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), tg); });

  // 雨衣
  const coat = [];
  if (o.coat){
    const cm = new THREE.MeshStandardMaterial({ color:0xffffff, map:coatTex(o.coat.color, o.coat.dot), roughness:.32, metalness:.05, side:THREE.DoubleSide });
    const cape = new THREE.Mesh(new THREE.SphereGeometry(.5, 28, 16, 0, Math.PI*2, 0, Math.PI*.6), cm); cape.scale.setScalar(1.08); cape.castShadow = true; body.add(cape); coat.push(cape);
    const open = .95;
    const hood = new THREE.Mesh(new THREE.SphereGeometry(.42, 30, 18, Math.PI/2 + open, Math.PI*2 - open*2, 0, Math.PI*.8), cm); hood.scale.setScalar(1.13); hood.castShadow = true; skull.add(hood); coat.push(hood);
    const topY = .14 + .42*.95*hs*1.13;
    if (o.coat.bearEars) [-1,1].forEach(s => {
      const e = add(head, new THREE.SphereGeometry(.13,16,12), cm, s*.29*hs, topY - .04, hz - .06); e.scale.set(1,1,.55); coat.push(e);
      const ie = add(head, new THREE.SphereGeometry(.075,12,8), mat(new THREE.Color(o.coat.dot).getHex()), s*.29*hs, topY - .04, hz); ie.scale.set(1,1,.4); coat.push(ie);
    });
    if (o.coat.duckHat){ const d = duckModel(); d.scale.setScalar(.24); d.position.set(0, topY - .06, hz + .05); head.add(d); coat.push(d); }
    if (o.coat.duckPendant){ const d = duckModel(); d.scale.setScalar(.14); d.position.set(.08, .42 - lo, .66); rig.add(d); coat.push(d); }
    else [.66, .5].forEach(y => { const b = add(rig, new THREE.CylinderGeometry(.045,.045,.03,14), mat(0xdfe6ee, {metalness:.7, roughness:.25}), 0, y - lo, .64); b.rotation.x = Math.PI/2; coat.push(b); });
  }
  g.scale.setScalar(o.scale);
  return { g, rig, head, eyes, legs, tail, coat, ears };
}

});

/* ================= 島主行為 ================= */
const center = k => ({ x:ISL[k].c[0], z:ISL[k].c[1] });
function plan(ag){
  const P = ag.P, g = ag.A.g, k = P.isl, c = center(k), m = ag.pet.move;
  const nearC = Math.hypot(g.position.x - c.x, g.position.z - c.z) < .4;
  if (!nearC) P.q.push({ x:c.x, z:c.z, sp:m.walk });
  const taken = AGENTS.filter(o => o !== ag).map(o => o.P.spot);
  const spots = VISITS[k].map((s, i) => ({ s, id:k + i })).filter(o => !taken.includes(o.id));
  if (spots.length && Math.random() < .55){
    const { s, id } = spots[Math.floor(Math.random()*spots.length)]; P.spot = id;
    const [lx, lz] = at(s.a, s.r); const face = s.R > s.r + .05 ? at(s.a, s.R) : null;
    P.q.push({ x:c.x+lx, z:c.z+lz, sp:m.walk, act:s.act, dur:rand(s.dur[0], s.dur[1]), y:s.y || 0, fx: face ? c.x+face[0] : null, fz: face ? c.z+face[1] : null });
  } else {
    P.spot = null;
    const n = ADJ[k][Math.floor(Math.random()*ADJ[k].length)]; const nc = center(n);
    P.q.push({ x:nc.x, z:nc.z, sp: Math.random() < m.runP ? m.run : m.walk, island:n, act:'idle', dur:rand(1, 2.4) });
  }
}
const lerpA = (a, b, k) => { let d = b - a; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2; return a + d*k; };
function updateAgent(ag, dt, t){
  const { A, P } = ag, g = A.g;
  if (!g.visible) return;
  if (P.mode === 'act'){ P.timer -= dt; if (P.timer <= 0){ if (!P.q.length) plan(ag); P.cur = P.q.shift(); P.mode = 'move'; P.run = P.cur.sp > 3; } }
  if (P.mode === 'move'){
    const c = P.cur, dx = c.x - g.position.x, dz = c.z - g.position.z, dist = Math.hypot(dx, dz), step = c.sp*dt;
    P.ty = (c.y && dist < 1.1) ? c.y : 0;
    if (dist <= step){
      g.position.x = c.x; g.position.z = c.z;
      if (c.island) P.isl = c.island;
      if (c.act){
        P.mode = 'act'; P.act = c.act; P.timer = c.dur; P.ty = c.y || 0;
        P.tHead = c.fx != null ? Math.atan2(c.fx - c.x, c.fz - c.z) : Math.atan2(camera.position.x - c.x, camera.position.z - c.z);
      } else if (P.q.length){ P.cur = P.q.shift(); P.run = P.cur.sp > 3; }
      else { P.mode = 'act'; P.act = 'idle'; P.timer = rand(.8, 1.6); }
    } else { g.position.x += dx/dist*step; g.position.z += dz/dist*step; P.tHead = Math.atan2(dx, dz); }
  }
  const k = 1 - Math.exp(-dt*12);
  g.rotation.y = lerpA(g.rotation.y, P.tHead, Math.min(1, dt*9));
  P.y += (P.ty - P.y)*Math.min(1, dt*6); g.position.y = TOP + P.y;
  const pose = { rx:0, rz:0, px:0, py:0, hx:0, hy:0, legs:[0,0,0,0], tx:-.15, tz:0, eye:1, breathe:0 };
  if (P.mode === 'move'){
    P.phase += dt*P.cur.sp*4.2; const s = Math.sin(P.phase), amp = P.run ? .95 : .6;
    pose.legs = [s*amp, -s*amp, -s*amp, s*amp]; pose.py = Math.abs(Math.sin(P.phase))*(P.run ? .14 : .05);
    pose.rx = P.run ? .1 : 0; pose.tx = P.run ? -.7 : -.2; pose.tz = Math.sin(P.phase*.5)*.25; pose.hx = P.run ? .12 : Math.sin(P.phase*2)*.03;
  } else switch (P.act){
    case 'eat': pose.hx = .55 + Math.sin(t*9)*.12; pose.tz = Math.sin(t*3)*.35; break;
    case 'sniff': pose.hx = .3 + Math.sin(t*16)*.05; pose.hy = Math.sin(t*1.3)*.4; pose.tz = Math.sin(t*5)*.25; break;
    case 'play': { const hop = Math.abs(Math.sin(t*5.5)); pose.py = hop*.6; pose.legs = [-hop*1.2,-hop*1.2,hop*.5,hop*.5]; pose.hx = -.35; pose.rx = -hop*.35; pose.tx = -.8; pose.tz = Math.sin(t*10)*.3; break; }
    case 'sleep': pose.rz = 1.38; pose.px = .6; pose.py = .3; pose.legs = [-.5,-.2,.4,.7]; pose.eye = .1; pose.hx = .15; pose.tx = .5; pose.breathe = Math.sin(t*2)*.025; break;
    default: pose.rx = -.22; pose.py = -.03; pose.legs = [0,0,-.9,-.9]; pose.hy = Math.sin(t*.9)*.5; pose.hx = -.08; pose.tz = Math.sin(t*2)*.5; pose.tx = .25;
  }
  P.blinkT -= dt; if (P.blinkT < 0){ pose.eye = Math.min(pose.eye, .1); if (P.blinkT < -.13) P.blinkT = rand(2, 5); }
  const { rig, head, legs, tail, eyes } = A;
  rig.rotation.x += (pose.rx - rig.rotation.x)*k; rig.rotation.z += (pose.rz - rig.rotation.z)*k;
  rig.position.x += (pose.px - rig.position.x)*k; rig.position.y += (pose.py - rig.position.y)*k;
  rig.scale.setScalar(1 + pose.breathe);
  head.rotation.x += (pose.hx - head.rotation.x)*k; head.rotation.y += (pose.hy - head.rotation.y)*k;
  legs.forEach((l, i) => { l.rotation.x += (pose.legs[i] - l.rotation.x)*Math.min(1, k*1.6); });
  tail.rotation.x += (pose.tx - tail.rotation.x)*k; tail.rotation.z += (pose.tz - tail.rotation.z)*k;
  eyes.forEach(e => { e.scale.y += (pose.eye*1.25 - e.scale.y)*Math.min(1, dt*25); });
}

const clock = new THREE.Clock();
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
let introDone = false;
function updateIntro(t){
  if (introDone) return;
  ORDER.forEach((k, i) => { const u = Math.min(1, Math.max(0, (t - .3 - i*.18)/1.1)); islandGroups[k].position.y = -10 + 10*easeOutBack(u); ISL[k].foam.material.opacity = .45*u; });
  bridges.forEach((b, i) => { const u = Math.min(1, Math.max(0, (t - 1.5 - i*.08)/.5)); b.scale.z = Math.max(.001, easeOutBack(u)); });
  AGENTS.forEach((ag, i) => { if (t > 2.0 + i*.35 && !ag.A.g.visible){ ag.A.g.visible = true; ag.P.y = 4; } });
  if (t > 2.5) document.querySelectorAll('.ilabel').forEach(l => l.classList.add('show'));
  if (t > 2.8){ ORDER.forEach(k => islandGroups[k].position.y = 0); bridges.forEach(b => b.scale.z = 1); introDone = true; }
}
const anchor = new THREE.Vector3();

  ducks.forEach(d => { d.a += d.s*dt; const x = Math.cos(d.a)*d.r, z = Math.sin(d.a)*d.r; d.m.position.set(x, WATER_Y + waveH(x, z, t) - .05, z); d.m.rotation.y = Math.atan2(-Math.sin(d.a)*Math.sign(d.s), Math.cos(d.a)*Math.sign(d.s)); d.m.rotation.z = Math.sin(t*2 + d.r)*.08; });
  anim.floatFish.forEach((f, i) => { const a = t*.8 + i*Math.PI, c = anim.floatFishCenter; f.position.set(c.x + Math.cos(a)*1.1, c.y + Math.sin(t*2 + i)*.25, c.z + Math.sin(a)*1.1); f.rotation.y = -a; });

  anim.scaleNeedle.rotation.y = Math.sin(t*.7)*.6;
  anim.hangBall.rotation.z = Math.sin(t*2.2)*.25;

  anim.butterflies.forEach(b => { const u = t*.6 + b.userData.off; b.position.set(Math.cos(u)*2.6, TOP + 1.4 + Math.sin(u*2.3)*.4, Math.sin(u*1.3)*2.2); b.rotation.y = -u; const f = Math.sin(t*18 + b.userData.off)*.9; b.userData.L.rotation.z = f; b.userData.R.rotation.z = -f; });

  anim.tubDuck.position.y = 1.02 + Math.sin(t*2.4)*.03; anim.tubDuck.rotation.y = 2.2 + Math.sin(t*.7)*.4;
  anim.bubbles.forEach(b => { const u = (t*b.userData.sp + b.userData.off) % 1; b.position.set(b.userData.x + Math.sin(u*9 + b.userData.off*6)*.25, TOP + 1.1 + u*3.2, b.userData.z); b.scale.setScalar(.6 + u*.8); b.material.opacity = .6*Math.sin(u*Math.PI); });
  const sleeper = AGENTS.find(ag => ag.A.g.visible && ag.P.mode === 'act' && ag.P.act === 'sleep');
  if (sleeper){ sleeper.A.head.getWorldPosition(anchor); anchor.y += .3; } else anchor.copy(anim.bedPos);
  zs.forEach((s, i) => { const u = (t*.35 + i/3) % 1; s.position.set(anchor.x + u*.6 + Math.sin(u*6)*.15, anchor.y + u*1.9, anchor.z); s.scale.setScalar(.32 + u*.38); s.material.opacity = Math.sin(u*Math.PI)*(sleeper ? 1 : .7); });

}

let tween = null;
function flyTo(pos, tgt, dur = 1.1){ tween = { t0:performance.now(), dur:dur*1000, p0:camera.position.clone(), p1:pos, g0:controls.target.clone(), g1:tgt }; }
function updateTween(){
  if (!tween) return;
  const u = Math.min(1, (performance.now() - tween.t0)/tween.dur), e = u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3)/2;
  camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.g0, tween.g1, e);
  if (u >= 1) tween = null;
}
function focusIsland(key){
  const c = ISL[key].c, tgt = new THREE.Vector3(c[0], 1.6, c[1]);
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  sph.radius = isMobile() ? 28 : 21; sph.phi = THREE.MathUtils.clamp(sph.phi, .7, 1.0);
  flyTo(tgt.clone().add(new THREE.Vector3().setFromSpherical(sph)), tgt);
}
const shift = { x:0, y:0, tx:0, ty:0 };
function updateShift(){
  shift.x += (shift.tx - shift.x)*.12; shift.y += (shift.ty - shift.y)*.12;
  if (Math.abs(shift.x) < .5 && Math.abs(shift.y) < .5 && !shift.tx && !shift.ty){ if (camera.view && camera.view.enabled) camera.clearViewOffset(); return; }
  camera.setViewOffset(W(), H(), shift.x, shift.y, W(), H());
}

/* ================= 點擊與滑過 ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function keyOf(o){ while (o){ if (o.userData && o.userData.key) return o.userData.key; o = o.parent; } return null; }
function pickAt(x, y){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((x - r.left)/r.width)*2 - 1, -((y - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  for (const h of ray.intersectObjects(pickables, true)){ if (!h.object.visible) continue; const k = keyOf(h.object); if (k) return k; }
  return null;
}
function handleKey(k){
  if (!k) return;
  if (k.startsWith('pet:')){ const ag = AGENTS.find(a => a.pet.id === k.slice(4)); heartBurst(ag); openModal('pet', ag.pet.id); }
  else if (k === 'store'){ focusIsland('groom'); openModal('store'); }
  else openIsland(k);
}
let downAt = null, hoverXY = null, hovered = null;
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', e => { downAt = { x:e.clientX, y:e.clientY, t:performance.now() }; });
cvs.addEventListener('pointerup', e => {
  if (!downAt) return;
  if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 7 && performance.now() - downAt.t < 600) handleKey(pickAt(e.clientX, e.clientY));
  downAt = null;
});
cvs.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') hoverXY = { x:e.clientX, y:e.clientY }; });
cvs.addEventListener('pointerleave', () => { hoverXY = null; setHover(null); });
function setHover(k){
  const isl = k === 'store' ? 'groom' : (ORDER.includes(k) ? k : null);
  if (isl !== hovered){
    hovered = isl;
    ORDER.forEach(key => { ISL[key].topMat.emissive.setHex(key === isl ? 0x2e1c10 : 0); ISL[key].label.classList.toggle('hot', key === isl); });
  }
  cvs.style.cursor = k ? 'pointer' : '';
}
controls.addEventListener('start', () => { tween = null; if (controls.autoRotate) setSpin(false); });

const labelsEl = $('#labels'), nav = $('#nav');
const labelTargets = [];
function makeLabel(html, onClick, cls = ''){
  const l = document.createElement('div'); l.className = 'ilabel glass ' + cls; l.setAttribute('role', 'button'); l.tabIndex = 0; l.innerHTML = html;
  l.addEventListener('click', onClick);
  l.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onClick(); } });
  labelsEl.appendChild(l); return l;
}
ORDER.forEach(k => {

  d.label.addEventListener('mouseenter', () => setHover(k)); d.label.addEventListener('mouseleave', () => setHover(null));
  labelTargets.push({ el:d.label, pos:() => tmpP.set(d.c[0], d.labelY, d.c[1]) });

const tmpP = new THREE.Vector3();
AGENTS.forEach(ag => {

  labelTargets.push({ el, pos:() => { ag.A.head.getWorldPosition(tmpP); tmpP.y += .95; return tmpP; }, hide:() => !ag.A.g.visible });
});
{ const sep = document.createElement('span'); sep.className = 'sep'; nav.appendChild(sep);

const tmpV = new THREE.Vector3();
function updateLabels(){

    L.el.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,-100%)`;

/* ================= 彈出視窗內容 ================= */
const hearts = n => `<span class="hearts" aria-label="喜愛度 ${n} 顆心">${'♥'.repeat(n)}<span class="dim">${'♥'.repeat(5-n)}</span></span>`;

const fmtNum = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(1);
const seg = cur => `<div class="seg" role="group" aria-label="選擇島主">${PETS.map(x => `<button data-pet="${x.id}" aria-pressed="${x.id === cur}"><span class="mini">${avatarHTML(x)}</span>${esc(x.name)}</button>`).join('')}</div>`;

function weightChart(ws, target){
  const Wd = 380, Ht = 160, p = { l:34, r:14, t:16, b:28 };
  const vals = ws.map(w => w.kg), lo = Math.min(...vals, target) - .2, hi = Math.max(...vals, target) + .2;
  const x = i => p.l + i*(Wd - p.l - p.r)/(ws.length - 1), y = v => p.t + (hi - v)/(hi - lo)*(Ht - p.t - p.b);
  const line = ws.map((w, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(w.kg).toFixed(1)}`).join(' ');
  const area = `${line} L${x(ws.length-1)},${Ht - p.b} L${x(0)},${Ht - p.b} Z`;
  const ticks = [lo + .2, (lo + hi)/2, hi - .2].map(v => `<text x="${p.l - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(1)}</text><line x1="${p.l}" x2="${Wd - p.r}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" stroke-opacity=".12"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="體重變化折線圖" style="color:var(--ink-soft);font-size:11px;fill:var(--ink-soft)">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff8f5e" stop-opacity=".35"/><stop offset="1" stop-color="#ff8f5e" stop-opacity="0"/></linearGradient></defs>
    ${ticks}
    <line x1="${p.l}" x2="${Wd - p.r}" y1="${y(target)}" y2="${y(target)}" stroke="#3fbf86" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${Wd - p.r}" y="${y(target) - 5}" text-anchor="end" style="fill:#3fbf86">目標 ${target}</text>
    <path d="${area}" fill="url(#wg)"/>
    <path d="${line}" fill="none" stroke="#ff8f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${ws.map((w, i) => `<circle cx="${x(i)}" cy="${y(w.kg)}" r="4.5" fill="#fff" stroke="#ff8f5e" stroke-width="2.5"/><text x="${x(i)}" y="${Ht - 8}" text-anchor="middle">${esc(w.d)}</text>`).join('')}
  </svg>`;
}

      <section class="sec"><h3>睡姿圖鑑（${s.poses.length} 種）</h3><div class="grid2">${s.poses.map(x => `<div class="card pose"><span class="em" aria-hidden="true">${x.emoji}</span><div class="t">${esc(x.name)}</div><div><span class="chip">${esc(x.freq)}</span></div>${paws(x.wild)}<div class="d">${esc(x.desc)}</div></div>`).join('')}</div></section>
      <p class="edit">🐾 越多代表睡姿越豪邁。</p>` };

    return { title:ISL.groom.name, sub:`${p.name}的洗澡 SPA 和美容紀錄`, html: seg(p.id) + `
      <p class="story">${esc(g.story)}</p>

        <div class="cta"><a href="tel:${STORE.tel}">📞 電話預約 ${STORE.phone}</a><a href="${STORE.line}" target="_blank" rel="noopener">💬 LINE 詢問</a></div>

      <p class="story">${esc(p.intro)}</p>
      <section class="sec"><div class="chips">${p.traits.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></section>
      <section class="sec"><div class="card"><dl class="kv"><dt>品種</dt><dd>${esc(p.breed)}</dd><dt>生日</dt><dd>${esc(p.birthday)}</dd><dt>目前體重</dt><dd>${w[w.length-1].kg} kg</dd><dt>每日睡眠</dt><dd>${esc(p.sleep.hours)}</dd><dt>最愛零食</dt><dd>${esc(p.food.favorites[0].name)}</dd><dt>美容頻率</dt><dd>${esc(p.groom.freq)}</dd></dl></div></section>

const modal = $('#modal'), panel = modal.querySelector('.panel');
let lastFocus = null, current = null;
function defaultPetFor(key){ const ag = AGENTS.find(a => a.P.isl === key); return (ag || AGENTS[0]).pet.id; }
function openModal(key, petId){
  if (ORDER.includes(key) && !petId) petId = defaultPetFor(key);
  current = { key, petId };
  const p = petId ? petById(petId) : null;
  const c = CONTENT[key](p);
  panel.style.setProperty('--theme', c.theme || ISL[key].theme);
  if (c.iconImg) $('#mIcon').innerHTML = `<img src="${c.iconImg}" alt="">`; else $('#mIcon').textContent = c.icon || ISL[key].emoji;
  $('#mTitle').textContent = c.title; $('#mSub').textContent = c.sub;
  const body = $('#mBody'); body.innerHTML = c.html; body.scrollTop = 0;
  body.querySelectorAll('[data-pet]').forEach(b => b.addEventListener('click', () => { openModal(current.key, b.dataset.pet); }));
  body.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { focusIsland(b.dataset.go); openModal(b.dataset.go, b.dataset.for); }));
  if (!modal.classList.contains('open')) lastFocus = document.activeElement;
  modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
  setSpin(false);
  requestAnimationFrame(() => { applyShift(); modal.querySelector('.close').focus({ preventScroll:true }); });
}
function applyShift(){ if (isMobile()){ shift.tx = 0; shift.ty = panel.offsetHeight*.42; } else { shift.tx = (panel.offsetWidth + 16)/2; shift.ty = 0; } }
function openIsland(k){ focusIsland(k); openModal(k); }
function closeModal(){
  if (!modal.classList.contains('open')) return;
  modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); shift.tx = 0; shift.ty = 0;
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll:true });
}
modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModal));
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
addEventListener('resize', () => { renderer.setSize(W(), H()); camera.aspect = W()/H(); camera.updateProjectionMatrix(); if (modal.classList.contains('open')) applyShift(); });

/* ================= 主迴圈 ================= */
let first = true;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  updateIntro(t); updateScene(dt, t); AGENTS.forEach(ag => updateAgent(ag, dt, t));
  updateTween(); updateShift(); controls.update();
  if (hoverXY && !downAt){ setHover(pickAt(hoverXY.x, hoverXY.y)); hoverXY = null; }
  renderer.render(scene, camera);
  updateLabels();
  if (first){ first = false; setTimeout(() => $('#loader').classList.add('gone'), 150); }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => texRedraws.forEach(f => f()));
loop();
})();
